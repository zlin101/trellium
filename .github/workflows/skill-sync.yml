name: Skill protocol sync

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # PR job: tests + drift detection + self-heal. It is the only job granted
  # write access: contents: write lets it push regenerated snapshots back to
  # the PR branch; pull-requests: write lets it leave a remediation comment
  # on fork PRs (which it cannot push to).
  sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the PR head branch so regenerated snapshots can be
          # pushed straight back to it.
          ref: ${{ github.head_ref }}

      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # Self-hosting gate: this repo maintains its own vault with the same
      # checker it ships. Errors fail the job (exit 2); warnings keep the
      # checker's exit-0 semantics and stay visible in the log. Read-only.
      - name: Self-hosting vault check
        run: python3 scripts/trellium.py check . --format json

      - name: Detect protocol snapshot drift
        id: drift
        continue-on-error: true
        run: python3 scripts/sync-skills.py --check

      # Same-repo PR: self-heal. Regenerate the snapshots and push them back to
      # the PR branch, so a contributor editing init/ never has to remember the
      # sync step. (Fork PRs cannot be pushed to and are handled below.)
      - name: Regenerate and push snapshots (same-repo PR)
        if: steps.drift.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python3 scripts/sync-skills.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(skill-sync): regenerate protocol snapshots

          Auto-regenerated by the skill-sync workflow after drift was detected.
          Reproduce locally with: python3 scripts/sync-skills.py"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Confirm snapshots are in sync
        if: steps.drift.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        run: python3 scripts/sync-skills.py --check

      # Fork PR: we cannot push to the branch, so leave a comment with the exact
      # command and then fail the check (the PR is genuinely still out of sync).
      - name: Comment remediation (fork PR)
        if: steps.drift.outcome == 'failure' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body=$(mktemp)
          cat > "$body" <<'EOF'
          Protocol snapshots under `skills/*/references/protocol-source/` are out of sync with `init/`.

          This PR comes from a fork, so CI cannot push the fix for you. Run locally and push:

          ```bash
          python3 scripts/sync-skills.py
          git commit -am "chore: regenerate protocol snapshots"
          git push
          ```
          EOF
          gh pr comment "$PR_NUMBER" --body-file "$body"
          exit 1

  # Push job: the same gates on branch pushes (main, develop). Strictly
  # read-only — it inherits the workflow-level contents: read and never
  # receives a write token.
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Self-hosting vault check
        run: python3 scripts/trellium.py check . --format json

      - name: Detect protocol snapshot drift
        id: drift
        continue-on-error: true
        run: python3 scripts/sync-skills.py --check

      # A push whose init/ changes do not match the committed snapshots must
      # fail loudly with the fix.
      - name: Fail on drift
        if: steps.drift.outcome == 'failure'
        run: |
          echo "Protocol snapshots are out of sync with init/." >&2
          echo "Fix: python3 scripts/sync-skills.py" >&2
          exit 1
